---
- name: Phase 1 (Secure) - Provision Isolated AWS 3-Tier Infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: Create project VPC network
      amazon.aws.ec2_vpc_net:
        name: portfolio-vpc
        cidr_block: 10.0.0.0/16
        region: "{{ aws_region }}"
        state: present
      register: vpc

    - name: Deploy Internet Gateway for public access
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        state: present
      register: igw

    # Subnet Layout
    - name: Allocate Public Subnet zone
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: 10.0.1.0/24
        region: "{{ aws_region }}"
        map_public: true
        state: present
      register: public_subnet

    - name: Allocate Private Subnet zone
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: 10.0.2.0/24
        region: "{{ aws_region }}"
        map_public: false  # Assures instances get NO public IP addresses
        state: present
      register: private_subnet

    # Routing Configuration
    - name: Connect Public Subnet to the Internet Gateway
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        subnets:
          - "{{ public_subnet.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw.gateway_id }}"
        state: present

    # Security Group Topologies
    - name: Public Security Group (Load Balancer)
      amazon.aws.ec2_security_group:
        name: portfolio-public-sg
        description: Accept internet public traffic and external SSH management
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports: [22, 80]
            cidr_ip: 0.0.0.0/0
        state: present
      register: lb_sg

    - name: App Server Security Group (App)
      amazon.aws.ec2_security_group:
        name: portfolio-app-sg
        description: Allow traffic from Load Balancer and management tunnels
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports: [22, 8080]
            cidr_ip: 10.0.0.0/16 # Restricts traffic exclusively to instances INSIDE this VPC network
        state: present
      register: app_sg

    - name: Database Server Security Group
      amazon.aws.ec2_security_group:
        name: portfolio-db-sg
        description: Accept MariaDB requests strictly from internal network
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports: [3306] # <--- FIX: Corrected port to match MariaDB/MySQL standard
            cidr_ip: 10.0.0.0/16
          - proto: tcp
            ports: [22]
            cidr_ip: 10.0.0.0/16
        state: present
      register: db_sg

    - name: Dynamically find the latest Amazon Linux 2023 AMI ID
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners: amazon
        filters:
          name: "al2023-ami-2023*-x86_64" # Wildcard string catches the latest version matrix
          root-device-type: ebs
      register: latest_ami

    - name: Set discovered AMI ID variable
      ansible.builtin.set_fact:
        resolved_ami_id: "{{ (latest_ami.images | sort(attribute='creation_date') | last).image_id }}"


    # Deploying Virtual Instances
    - name: Deploy Public Facing Load Balancer
      amazon.aws.ec2_instance:
        name: portfolio-lb
        region: "{{ aws_region }}"
        image_id: "{{ resolved_ami_id }}"
        instance_type: "{{ instance_type }}"
        key_name: "{{ key_name }}"
        security_group: "{{ lb_sg.group_id }}"
        vpc_subnet_id: "{{ public_subnet.subnet.id }}"
        network:
          assign_public_ip: true
        tags:
          Tier: loadbalancer
          Environment: Production
        state: running

    - name: Deploy App Server Tiers via Iteration Loops
      amazon.aws.ec2_instance:
        name: "{{ item.name }}"
        region: "{{ aws_region }}"
        image_id: "{{ resolved_ami_id }}"
        instance_type: "{{ instance_type }}"
        key_name: "{{ key_name }}"
        security_group: "{{ app_sg.group_id }}"
        vpc_subnet_id: "{{ private_subnet.subnet.id }}"
        network:
          assign_public_ip: false # Blocks public IP assignment completely
        tags:
          Tier: "{{ item.tier }}"
          Environment: Production
        state: running
      loop:
        - { name: "portfolio-app-01", tier: "webserver" }
        - { name: "portfolio-app-02", tier: "webserver" }

    - name: Deploy Database Server Tier via Iteration Loops
      amazon.aws.ec2_instance:
        name: "{{ item.name }}"
        region: "{{ aws_region }}"
        image_id: "{{ resolved_ami_id }}"
        instance_type: "{{ instance_type }}"
        key_name: "{{ key_name }}"
        security_group: "{{ db_sg.group_id }}"
        vpc_subnet_id: "{{ private_subnet.subnet.id }}"
        network:
          assign_public_ip: false # Blocks public IP assignment completely
        tags:
          Tier: "{{ item.tier }}"
          Environment: Production
        state: running
      loop:
        - { name: "portfolio-db", tier: "database" }